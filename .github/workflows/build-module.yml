name: build-module

on:
  workflow_dispatch:
  schedule:
    # 每周一 08:00 UTC 自动重建：拉取最新 mihomo / zashboard 等依赖（自更新）
    - cron: "0 8 * * 1"

env:
  GH_TOKEN: ${{ github.token }}
  # 脚本内 curl GitHub API 认证用（避免未认证 60 次/小时限流）
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  build:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # 手机真实架构 aarch64（Go 内部链接器不支持 android/amd64，
          # amd64 仅用于 x86_64 模拟器且需 NDK+cgo，故 CI 只出 arm64 包）
          - goos: android
            goarch: arm64

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 接收环境变量
        run: |
          echo "GOOS=${{ matrix.goos }}" >> $GITHUB_ENV
          echo "GOARCH=${{ matrix.goarch }}" >> $GITHUB_ENV

      - name: CI
        run: |
          bash tools/ci.sh
      
      - name: Setup upterm session
        uses: owenthereal/action-upterm@v1
        if: ${{ failure() }}
        with:
          wait-timeout-minutes: 20
      
      - name: 上传模块至 artifacts
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          path: build/module.zip