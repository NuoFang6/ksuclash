name: build-module

on:
  workflow_dispatch:
  schedule:
    # 每周一 08:00 UTC 自动重建：拉取最新 mihomo / zashboard 等依赖（自更新）
    - cron: "0 8 * * 1"

jobs:
  build:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # 每个架构都独立编译
          # 常见手机架构 aarch64
          - goos: android
            goarch: arm64
          # avd x86_64 模拟器
          - arch: android
            goarch: amd64

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 设置环境变量
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          echo "GOOS=${{ matrix.goos }}" >> $GITHUB_ENV
          echo "GOARCH=${{ matrix.goarch }}" >> $GITHUB_ENV
          echo "$GOOS $GOARCH" > helper-go/env.txt

      - name: 准备 mihomo
        run: |
          echo "当前 mihomo 版本: $(git submodule status --recursive | awk '{print $1}'), 尝试更新..."
          git submodule update --init --recursive
          git submodule update --remote --merge
          git diff --quiet && git diff --staged --quiet || (
            git add .
            git commit -m "[skip ci] Chore: auto-update submodule to latest version"
          )
          echo "更新后的 mihomo 版本: $(git submodule status --recursive | awk '{print $1}')"

          echo "应用 mihomo 补丁..."
          bash tools/apply-mihomo-patches.sh

      - name: 下载最新 zashboard
        run: |
          zashboard_repo="Zephyruso/zashboard"
          zashboard_file="dist-no-fonts.zip"
          zashboard_ver=$(gh release view --repo $zashboard_repo --json tagName --jq '.tagName')
          echo "zashboard_ver=$zashboard_ver" >> $GITHUB_ENV
          zashboard_commit=$(gh release view --repo $zashboard_repo --json targetCommitish --jq '.targetCommitish[:7]')
          echo "zashboard_commit=$zashboard_commit" >> $GITHUB_ENV

          curl -L https://github.com/$zashboard_repo/releases/latest/download/dist-no-fonts.zip -o tmp/zashboard.zip
          zashboard_expected_sha=$(gh release view --repo $zashboard_repo --json assets --jq ".assets[] | select(.name==\"$zashboard_file\") | .digest" | cut -d: -f2)
          zashboard_actual_sha=$(sha256sum tmp/zashboard.zip | awk '{print $1}')
          if [ "$zashboard_expected_sha" = "$zashboard_actual_sha" ]; then
              echo "zashboard 下载成功，校验通过！"
          else
              echo "校验失败！"
              echo "预期 $zashboard_expected_sha"
              echo "实际 $zashboard_actual_sha"
              exit 1
          fi

      - name: 设置 Golang
        id: setup-go
        uses: actions/setup-go@v7
        with:
          go-version: stable # 最新稳定版
          check-latest: true # 始终使用最新的 Go 版本，而不是缓存优先
          cache-dependency-path: | # 避免在不兼容的构建中重复使用缓存
            helper-go/go.sum
            helper-go/env.txt

      - name: 显示编译环境
        run: |
          echo "Go:"
          echo "安装的版本: ${{ steps.setup-go.outputs.go-version }}"
          echo "缓存命中: ${{ steps.setup-go.outputs.cache-hit }}"
          echo ""
          echo "Zashboard:"
          echo "版本: $zashboard_ver"
          echo "提交: $zashboard_commit"

      - name: 编译 helper-go
        run: |
          bash tools/build-helper-go.sh

      - name: 下载 helper-apk 构建工具（build-tools / android.jar / kotlinc）
        run: |
          bash tools/get-tools.sh

      - name: 编译 helper-apk
        run: |
          bash tools/build-helper-apk.sh

      - name: 编译 mihomo
        run: |
          bash tools/build-mihomo.sh

      - name: 打包模块
        run: |
          bash tools/package-module.sh
      
      - name: 上传模块至 artifacts
        uses: actions/upload-artifact@v7
        with:
          archive: false # 避免 github 二次 zip
          if-no-files-found: error
          path: build/output/suclash_module.zip