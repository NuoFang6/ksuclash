name: build-module

on:
  workflow_dispatch:
  schedule:
    # 每周一 08:00 UTC 自动重建：拉取最新 mihomo / zashboard 等依赖（自更新）
    - cron: "0 8 * * 1"

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  build:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # 每个架构都独立编译
          # 常见手机架构 aarch64
          # - goos: android
          #   goarch: arm64
          # avd x86_64 模拟器
          - goos: android
            goarch: amd64

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 接收环境变量
        run: |
          echo "GOOS=${{ matrix.goos }}" >> $GITHUB_ENV
          echo "GOARCH=${{ matrix.goarch }}" >> $GITHUB_ENV

      - name: CI
        run: |
          bash tools/ci.sh
      
      - name: Setup upterm session
        uses: owenthereal/action-upterm@v1
        if: ${{ failure() }}
        with:
          wait-timeout-minutes: 20
      
      - name: 上传模块至 artifacts
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          path: build/module.zip