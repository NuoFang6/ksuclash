name: build-module

on:
  workflow_dispatch:
  schedule:
    # 每周一 03:00 UTC 自动重建：拉取最新 mihomo / zashboard 等依赖（自更新）
    - cron: '0 3 * * 1'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - uses: actions/setup-go@v6
        with:
          go-version-file: helper-go/go.mod
          cache-dependency-path: helper-go/go.sum

      - name: Install pnpm (corepack)
        run: corepack enable && corepack prepare pnpm@latest --activate

      # helper 虽仅依赖 yaml.v3，但 android/amd64 的 syscall/net 需要 cgo（NDK），
      # arm64 恰好纯 Go 能过、amd64 不能；统一走 cgo 更一致。runner 预装 NDK。
      - name: Fetch mihomo cores + build Go helpers (arm64 + amd64)
        id: mihomo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p module/bin

          # 定位 NDK clang（ubuntu runner 预装，ANDROID_NDK_HOME 已指向默认 NDK）
          NDK_ROOT="${ANDROID_NDK_HOME:-}"
          if [ -z "$NDK_ROOT" ] || [ ! -d "$NDK_ROOT" ]; then
            NDK_ROOT=$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | tail -1 || true)
          fi
          [ -n "$NDK_ROOT" ] && [ -d "$NDK_ROOT" ] || { echo "!! NDK not found" >&2; exit 1; }
          CLANG_DIR="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "NDK: $NDK_ROOT"

          VER=$(gh api repos/MetaCubeX/mihomo/releases/latest --jq .tag_name)
          echo "mihomo: $VER"
          echo "version=$VER" >> "$GITHUB_OUTPUT"

          # 每个架构：下载对应 mihomo 资产 + 用 NDK cgo 交叉编译 helper + 校验 ELF
          # 参数: goarch mihomo_asset mihomo_out helper_out clang_prefix elf_pattern
          build_arch() {
            local goarch="$1" asset="$2" core_out="$3" helper_out="$4" ccpre="$5" elfpat="$6"
            # mihomo 核心
            local url
            url=$(gh api repos/MetaCubeX/mihomo/releases/latest \
              --jq ".assets[] | select(.name | contains(\"$asset\")) | .browser_download_url" | head -1)
            [ -n "$url" ] || { echo "!! missing mihomo asset: $asset" >&2; exit 1; }
            curl -sSL -o "/tmp/mihomo-$goarch.gz" "$url"
            gunzip -c "/tmp/mihomo-$goarch.gz" > "module/bin/$core_out"
            chmod +x "module/bin/$core_out"
            file "module/bin/$core_out" | tee /dev/stderr | grep -q "$elfpat"
            # helper（同一 clang；文件名带 API 号，如 aarch64-linux-android24-clang，用 * 匹配）
            local cc
            cc=$(ls "$CLANG_DIR"/"$ccpre"*-clang 2>/dev/null | head -1)
            [ -n "$cc" ] || { echo "!! NDK clang not found for $ccpre" >&2; exit 1; }
            ( cd helper-go && CGO_ENABLED=1 GOOS=android GOARCH="$goarch" CC="$cc" \
              go build -trimpath -o "../module/bin/$helper_out" . )
            chmod +x "module/bin/$helper_out"
            file "module/bin/$helper_out" | tee /dev/stderr | grep -q "$elfpat"
            echo "  $goarch: core=$core_out helper=$helper_out"
          }

          # arm64 = 默认（无后缀），amd64 = .amd64（customize.sh 按 $ARCH 选择）
          build_arch arm64 "android-arm64-v8"  mihomo                suclash_helper        aarch64-linux-android "ELF 64-bit.*ARM aarch64"
          build_arch amd64 "android-amd64"     mihomo.amd64          suclash_helper.amd64  x86_64-linux-android  "ELF 64-bit.*x86-64"

      - name: Build zashboard (latest main, no bundled fonts)
        run: |
          git clone --depth 1 https://github.com/Zephyruso/zashboard zashboard
          cd zashboard
          pnpm install --frozen-lockfile
          FONT=none pnpm build

      - name: Package UI with floating panel
        run: node devtools/patch-ui.mjs zashboard/dist module

      - name: Build helper APK
        run: |
          bash devtools/get-tools.sh
          bash devtools/build-apk.sh

      - name: Stamp version into module.prop
        run: |
          DATE=$(date +%Y%m%d)
          CODE=$(date +%s | cut -c3-10)
          VER="v1.0.0-${DATE}-mihomo${{ steps.mihomo.outputs.version }}"
          sed -i "s/^version=.*/version=$VER/; s/^versionCode=.*/versionCode=$CODE/" module/module.prop
          cat module/module.prop

      - name: Assemble module zip
        # 用 python packer：正斜杠路径 + 显式可执行位（部分安装器解压不保留 zip mode）
        run: |
          NAME="ksuclash-${{ steps.mihomo.outputs.version }}-$(date +%Y%m%d)"
          python3 devtools/make-module-zip.py module "$NAME.zip"
          unzip -l "$NAME.zip" | head -20
          echo "ZIP_NAME=$NAME" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}.zip
          if-no-files-found: error

      - name: Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP_NAME }}.zip
          generate_release_notes: true
