<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>SU Clash</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, "MiSans", "HarmonyOS Sans", sans-serif;
    background: #0f172a; color: #e2e8f0; min-height: 100vh;
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  @media (prefers-color-scheme: light) {
    body { background: #f1f5f9; color: #0f172a; }
    .card { background: #fff !important; }
    .card button { background: #e2e8f0 !important; color: #0f172a !important; }
    .card button.pri { background: #2563eb !important; color: #fff !important; }
  }
  .card {
    width: 100%; max-width: 380px; background: #1e293b;
    border-radius: 18px; padding: 24px; box-shadow: 0 8px 30px rgba(0,0,0,.35);
    font-size: 14px;
  }
  .title { font-weight: 700; font-size: 17px; display: flex; align-items: center; gap: 8px; }
  .tag { font-size: 11px; background: #334155; color: #cbd5e1; border-radius: 99px; padding: 2px 8px; font-weight: 400; }
  .status { margin: 14px 0 4px; font-size: 13px; line-height: 1.6; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; background: #64748b; vertical-align: middle; }
  .dot.on { background: #22c55e; } .dot.panic { background: #ef4444; }
  .big { font-size: 15px; font-weight: 700; margin: 6px 0 2px; }
  .row { display: flex; gap: 8px; margin-top: 14px; }
  button { border: none; border-radius: 10px; padding: 12px 0; font-size: 14px; font-weight: 600;
    background: #334155; color: #e2e8f0; cursor: pointer; flex: 1; }
  button.pri { background: #2563eb; color: #fff; }
  button:active { filter: brightness(1.25); }
  .hint { font-size: 11.5px; opacity: .6; margin-top: 12px; line-height: 1.7; }
</style>
</head>
<body>
<div class="card">
  <div class="title">⚡ SU Clash <span class="tag">mihomo</span></div>
  <div class="status" id="st">读取状态中…</div>
  <div id="ctl"></div>
  <div class="hint">启动后自动进入 zashboard 面板；核心操作经 root 桥执行。</div>
</div>
<script>
const CTL = '/data/adb/modules/suclash/scripts/clashctl'
const $ = id => document.getElementById(id)
function run(cmd) {
  try { return Promise.resolve(window.ksu.exec(cmd) || '') }
  catch (e) { return Promise.resolve('') }
}
function state() {
  return run(CTL + ' status').then(out => (out.match(/state=(\w+)/) || [])[1] || 'off')
}
function openPanel() {
  return run(CTL + ' panel').then(out => {
    const url = (out.match(/http\S+/) || [])[0]
    location.replace(url || 'http://127.0.0.1:9090/ui/')
  })
}
function waitRunning(sec) {
  return state().then(st => {
    if (st === 'on') return true
    if (sec <= 0) return false
    return new Promise(res => setTimeout(() => res(waitRunning(sec - 2)), 2000))
  })
}
function render(st) {
  const dot = st === 'on' ? 'on' : (st === 'panic' ? 'panic' : '')
  const label = { on: '核心运行中', off: '核心未运行', starting: '启动中…', stopping: '停止中…', panic: '已熔断（反复异常）' }[st] || st
  $('st').innerHTML = `<span class="dot ${dot}"></span>${label}`
  if (st === 'on') { openPanel(); return }
  if (st === 'panic') {
    $('ctl').innerHTML = '<div class="row"><button class="pri" data-a="resume">恢复并启动</button></div>'
    return
  }
  $('ctl').innerHTML =
    (st === 'off' ? '<div class="big">zashboard 面板不可用</div><div class="hint">核心停止时面板无法访问。启动后自动进入。</div>' : '') +
    '<div class="row"><button class="pri" data-a="start">启动核心</button><button data-a="retry">重试</button></div>'
}
function act(a) {
  if (a === 'retry') return refresh()
  render('starting')
  run(CTL + ' ' + a).then(() => waitRunning(40).then(ok => ok ? openPanel() : refresh()))
}
document.addEventListener('click', e => { const a = e.target.dataset && e.target.dataset.a; if (a) act(a) })
function refresh() { state().then(render) }
refresh()
</script>
</body>
</html>
